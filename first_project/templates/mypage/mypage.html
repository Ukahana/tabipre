{% extends "base.html" %}
{% load static %}

{% block extra_css %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'tabipre/css/mypage/mypage.css' %}">
{% endblock %}
{% block body_class %}mypage{% endblock %}

{% block content %}
<div class="container mt-4">

    {% include 'includes/toast.html' %} 
    <div class="mb-5 sub-title">マイページ</div>

    <div class="d-grid gap-3">

        <a href="{% url 'app:favorites_list' %}" class="app-btn app-btn-warning">
            お気に入りリストの表示
        </a>

        <a href="{% url 'app:share_settings' %}" class="app-btn app-btn-secondary">
            共有リンクの設定
        </a>

    </div>

    <div class="mt-3 link-section">
        <p><a href="{% url 'app:account_edit' %}" class="link-text">アカウント名変更</a></p>
        <p><a href="{% url 'app:account_email' %}" class="link-text">メールアドレス変更</a></p>
        <p><a href="{% url 'app:password_change' %}" class="link-text">パスワードのみ変更</a></p>
    </div>

</div>
{% endblock %}
