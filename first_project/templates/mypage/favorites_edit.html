{% extends 'base.html' %}
{% load static %}

{% block body_class %}favorites_edit{% endblock %}

{% block extra_css %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'tabipre/css/mypage/my_favorites.css' %}">
<link rel="stylesheet" href="{% static 'tabipre/css/mypage/mypage.css' %}">
{% endblock %}

{% block content %}
<div class="container mt-4">

  <div class="mb-4 sub-title">お気に入りリスト</div>

  <form method="post">
    {% csrf_token %}

    <ul class="edit-list mt-2">
      {% for item in favorite.items.all %}
        <li class="item-row mt-1">
          <span class="dot">・</span>
          <input type="text" class="form-control item-input"
                 value="{{ item.item_name }}">
          <button type="button" class="remove-item">×</button>
        </li>
      {% endfor %}
    </ul>

    <input type="hidden" name="items" id="items-hidden">
    <ul id="errorlist" class="errorlist" style="display:none;"></ul>

    <div class="mb-3">
      <button type="button" id="add-item" class="btn w-100">＋ 項目を追加</button>
    </div>

    <div class="d-grid gap-2 mb-3">
      <button type="submit" class="btn save-btn">保存</button>
    </div>
  </form>

  <div class="text-center mb-2">
    <a href="{% url 'app:favorites_list' %}" class="back-link">キャンセル</a>
  </div>

</div>

<script src="{% static 'tabipre/js/mypage/favorites_edit.js' %}"></script>
{% endblock %}
