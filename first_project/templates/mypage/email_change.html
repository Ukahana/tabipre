{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">

    <h2 class="mb-4 sub-title">メールアドレス変更</h2>

    <form method="post" novalidate>
        {% csrf_token %}

        <div class="mb-3">
            <label for="current_email" class="form-label">現在のメールアドレス</label>
            <input
                type="email"
                id="current_email"
                name="current_email"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label for="new_email" class="form-label">新しいメールアドレス</label>
            <input
                type="email"
                id="new_email"
                name="new_email"
                class="form-control"
                required
            >
        </div>

        <div class="d-grid gap-2 mb-4">
            <button type="submit" class="app-btn-primary">変更</button>
        </div>
    </form>

    <div class="text-center mb-3">
        <a href="{% url 'app:mypage' %}" class="back-link">キャンセル</a>
    </div>

</div>
{% endblock %}
