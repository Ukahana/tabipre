<div class="modal fade" id="copyModal" tabindex="-1">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">テンプレートを選択</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        {% if templates %}
        <form method="POST" action="{% url 'app:travel_step2' %}">
          {% csrf_token %}
          <input type="hidden" name="action" value="copy">

          {% for template in templates %}

            <input type="radio"
                   id="t{{ template.id }}"
                   name="old_travel_id"
                   value="{{ template.travel_info.travel_info_id }}"
                   class="radio-select">

            <div class="template-card">

              <label for="t{{ template.id }}" class="template-select-area">
                <div class="template-item">

                  {% if template.display_status %}
                    <span class="badge-t
                      {% if template.display_status == '未' %}status-mi
                      {% elif template.display_status == '完' %}status-kan
                      {% elif template.display_status == '済' %}status-zumi
                      {% endif %}
                    ">
                      {{ template.display_status }}
                    </span>
                  {% endif %}

                  <div class="template-text">
                    <strong>{{ template.travel_info.travel_title }}</strong>
                    <small class="text-muted">
                      {% if template.travel_info.end_date %}
                        {{ template.travel_info.start_date|date:"Y.n.j" }} ～ {{ template.travel_info.end_date|date:"Y.n.j" }}
                      {% else %}
                        {{ template.travel_info.start_date|date:"Y.n.j" }}
                      {% endif %}
                    </small>
                  </div>

                </div>
              </label>

              <button type="submit"
                      class="btn-select"
                      onclick="document.getElementById('t{{ template.id }}').checked = true;">
                選択
              </button>

            </div>

          {% endfor %}

        </form>

        {% else %}
          <p>コピーできるテンプレートがありません。</p>
        {% endif %}

      </div>

    </div>
  </div>
</div>
