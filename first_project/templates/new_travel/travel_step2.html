{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'tabipre/css/parts/travel_edit.css' %}">
{% endblock %}

{% block content %}
<div class="container mt-2">

    <div class="sub-title mb-2">詳細設定</div>

    <!--  Step2 のフォーム（旅行情報入力） -->
    <form method="POST" class="travel_step2_form">
        {% csrf_token %}

        {% include 'parts/travel_step2_form.html' %}

        <div class="mt-3 d-flex flex-column gap-3">
            <button type="submit" name="action" value="template" class="btn btn-create">
                テンプレート作成
            </button>

            <!--  モーダルを開くだけ（POST しない） -->
            <button type="button" id="open-modal-btn" class="btn btn-copy">
              前回のテンプレートをコピー
            </button>

        </div>
    </form>

</div>
<div id="modal-flag" data-open-modal="{{ open_modal|yesno:'true,false' }}"></div>
<!-- JS -->
<script src="{% static 'tabipre/js/new_travel/travel_step2.js' %}"></script>

<!--  モーダルは必ず form の外に置く（重要） -->
{% include 'new_travel/modal/old_travel.html' %}

{% endblock %}
