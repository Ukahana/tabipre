<div class="modal fade"
     id="continueModal"
     tabindex="-1"
     data-edit-url="{% url 'app:old_template_edit' template.id %}">

  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-body text-center">
        <p>追加を続けますか？</p>

        <div class="d-flex gap-4 justify-content-center mt-3">

          <!-- はい：元のフォームを continue=1 で送信 -->
          <button type="button"
                  class="modal-yes"
                  onclick="submitCategoryForm('continue')">
              はい
          </button>

          <!-- いいえ：POSTしない。edit に戻る -->
          <button type="button"
                  class="modal-no"
                  onclick="submitCategoryForm('cancel')">
           いいえ
          </button>


        </div>

      </div>

    </div>
  </div>
</div>
