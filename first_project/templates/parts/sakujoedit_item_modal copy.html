{% load static %}
<div class="modal fade eddit_item_modal"
     id="editItemModal"
     tabindex="-1"
     data-open="{% if open_edit_modal %}1{% else %}0{% endif %}"
     data-item-id="{{ open_edit_modal }}"
     data-item-name="{{ edit_item_name }}">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">

      <div class="modal-header border-0 justify-content-center position-relative">
        <h5 class="modal-title text-center w-100">編集</h5>
      </div>

      {% if open_edit_modal and messages %}
      <div class="px-3 pt-2">
        {% for message in messages %}
          <div class="alert alert-danger py-1 mb-2">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}

      <form method="POST" action="{% url 'app:edit_item' 0 %}" id="editItemForm">
        {% csrf_token %}

        <!-- 編集用 -->
        <input type="hidden" name="edit_item_id" id="editItemId">

        <!-- ★ 削除用（button の外に置く） -->
        <input type="hidden" name="delete_item" id="deleteItemId">

        <div class="modal-body">
          <div class="d-flex align-items-center">

            <input type="text"
                   name="item_name"
                   id="editItemInput"
                   class="form-control border-0 border-bottom me-3"
                   placeholder="項目を入力">

            <div class="text-center d-flex flex-column align-items-center">
              <div class="delete-label text-danger small mb-1">削除</div>

              <!-- 削除ボタン -->
              <button type="submit"
                      name="delete"
                      value="1"
                      class="btn p-0"
                      style="border: none; background: none;">
                <img src="{% static 'tabipre/icons/trash.png' %}" width="22" alt="削除">
              </button>
            </div>

          </div>
        </div>

        <div class="modal-footer d-flex flex-column align-items-center border-0">
          <button type="submit" class="btn btn-primary mb-0 w-75 py-2">登録</button>
          <a href="#" class="back-link" data-bs-dismiss="modal">キャンセル</a>
        </div>

      </form>

    </div>
  </div>
</div>
