{% load static %}

<div class="modal fade" id="favoriteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">追加するものをチェック</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <form id="favoriteSelectForm">

          {% for fav in favorite_items %}
            <label class="stay-option d-flex align-items-center mb-2">
              <input class="favorite-radio"
                     type="radio"
                     name="favorite_choice"
                     value="{{ fav.item_name }}">
              <span class="ms-2">{{ fav.item_name }}</span>
            </label>
          {% endfor %}

        </form>

      </div>

      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-primary favorite" id="favoriteSelectBtn" data-next="{{ next_url }}">
          登録
        </button>
      </div>

    </div>
  </div>
</div>
