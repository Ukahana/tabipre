<div class="card mb-3 shadow-sm">
    <div class="card-body">

        <div class="d-flex align-items-start">

            <span id="travelStatus"
                  data-end-date="{{ card_travel_info.end_date|date:'Y-m-d' }}"
                  class="badge-t 
                      {% if card_travel_info.status_label == '未' %}status-mi
                      {% elif card_travel_info.status_label == '完' %}status-kan
                      {% elif card_travel_info.status_label == '済' %}status-zumi
                      {% endif %}
                      status-vertical">
                {{ card_travel_info.status_label }}
            </span>

            <div class="ms-2 flex-grow-1">

                <h5 class="mb-1">{{ card_travel_info.travel_title }}</h5>

                <div class="d-flex justify-content-between align-items-center">
                    <p class="travel-date mb-0">
                        {{ card_travel_info.start_date|date:"Y.n.j" }}
                        ～
                        {{ card_travel_info.end_date|date:"Y.n.j" }}
                    </p>

                    <span id="totalCheckCount" class="badge bg-light text-dark">
                        {{ checked_items }} / {{ total_items }}
                    </span>
                </div>

            </div>
        </div>

    </div>
</div>
