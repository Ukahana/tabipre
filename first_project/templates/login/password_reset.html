{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'tabipre/css/login.css' %}">
{% endblock %}

{% block content %}

<div class="container mt-5 pass-reset">

    <div class="sub-title mb-5">パスワード再設定</div>

    <form method="POST">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">

        <div class="mt-3 mb-3">
            <label for="{{ form.email.id_for_label }}">メールアドレス</label>
            {{ form.email }}

            {% if form.email.errors %}
                 {% for error in form.email.errors %}
                    <div class="text-danger small">{{ error }}</div>
                 {% endfor %}
            {% endif %}
        </div>

        <input type="submit" value="再設定用メールを送信" class="btn btn-primary w-100">
    </form>

    <div class="link mt-5">
        <a href="{% url 'app:login' %}?next={{ request.GET.next }}">ログインはこちら</a>
    </div>

</div>
{% endblock %}
